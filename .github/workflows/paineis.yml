name: Atualizar painéis do perfil

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/gerar.py"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gerar.py
      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza painéis do perfil"
          # aponta o README para a versão exata das imagens (evita cache velho do GitHub)
          sha=$(git rev-parse HEAD)
          sed -i -E "s#guimaraesleiteg-png/guimaraesleiteg-png/(main|[0-9a-f]{40})/assets/#guimaraesleiteg-png/guimaraesleiteg-png/$sha/assets/#g" README.md
          git commit -am "Fixa imagens do README na versão $sha"
          git push
